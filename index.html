<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>وبینار طراحی محصول</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#222;--card:#111}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.container{max-width:720px;margin:0 auto;padding:2rem 1.25rem}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}h1{font-size:2.4rem;margin-bottom:1rem}.agenda{margin:2rem 0}.item{padding:1rem;border:1px solid var(--border);border-radius:8px;margin-bottom:1rem;background:var(--card)}button.theme{background:none;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer}button.cta{background:var(--accent);color:var(--bg);border:none;padding:1rem 2rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:1.1rem;margin-top:1rem}</style>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"></head>
<body><div class="container"><header><div>وبینار</div><button class="theme" onclick="toggleTheme()">تم</button></header><h1>طراحی محصول فارسی — ۲۴ آبان</h1><p style="color:var(--muted);margin-bottom:2rem">آموزش عملی طراحی محصول برای بازار ایران. سخنران: طراحان با تجربه در استارتاپ‌های موفق.</p><div class="agenda"><div class="item"><strong>۱۸:۳۰:</strong> مبانی تحقیق کاربر فارسی</div><div class="item"><strong>۱۹:۱۵:</strong> ساخت پروتوتایپ سریع</div><div class="item"><strong>۲۰:۰۰:</strong> پرسش و پاسخ و مطالعه موردی</div></div><button class="cta">ثبت‌نام رایگان</button></div>
<script>function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme')||'light';h.setAttribute('data-theme',c==='light'?'dark':'light');localStorage.setItem('theme',h.getAttribute('data-theme'));}if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script></body></html>
